{{- if .Values.apiGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    {{- include "geoface.labels" (dict "name" "api-gateway" "root" $) | nindent 4 }}
spec:
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels:
      {{- include "geoface.selector" (dict "name" "api-gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "geoface.selector" (dict "name" "api-gateway") | nindent 8 }}
    spec:
      containers:
        - name: api-gateway
          image: "{{ .Values.apiGateway.image.repository }}:{{ include "geoface.imageTag" (dict "svc" .Values.apiGateway "root" $) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.apiGateway.port }}
          env:
            - name: PORT
              value: "{{ .Values.apiGateway.port }}"
            {{- range $k, $v := .Values.apiGateway.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.apiGateway.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.apiGateway.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    {{- include "geoface.labels" (dict "name" "api-gateway" "root" $) | nindent 4 }}
spec:
  selector:
    {{- include "geoface.selector" (dict "name" "api-gateway") | nindent 4 }}
  ports:
    - port: {{ .Values.apiGateway.port }}
      targetPort: {{ .Values.apiGateway.port }}
{{- end }}

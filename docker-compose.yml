# GeoFace Attendance System — orkestrasi lokal semua service.
# Jalankan: docker compose up --build

services:
  # ---------- Infrastruktur ----------
  postgres:
    image: postgis/postgis:15-3.4
    container_name: geoface-postgres
    environment:
      POSTGRES_DB: geoface_db
      POSTGRES_USER: ${POSTGRES_USER:-geoface}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geoface123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geoface} -d geoface_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: geoface-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Application services ----------
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: dockerfile
    container_name: geoface-ai-service
    ports:
      # host 5001 -> container 5000. Port 5000 di macOS dipakai AirPlay Receiver.
      - "5001:5000"
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
    depends_on:
      minio:
        condition: service_started

  core-service:
    build:
      context: ./services/core-service
      dockerfile: dockerfile
    container_name: geoface-core-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-geoface}:${POSTGRES_PASSWORD:-geoface123}@postgres:5432/geoface_db
      - AI_SERVICE_URL=http://ai-service:5000
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: dockerfile
    container_name: geoface-api-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - CORE_SERVICE_URL=http://core-service:3001
      - AI_SERVICE_URL=http://ai-service:5000
    depends_on:
      core-service:
        condition: service_started

volumes:
  pgdata:
  miniodata:

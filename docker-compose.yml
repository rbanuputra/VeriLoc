# GeoFace Attendance System — orkestrasi lokal semua service.
# Jalankan: docker compose up --build

services:
  # ---------- Infrastruktur ----------
  postgres:
    platform: linux/arm64
    build:
      context: ./services/postgres
      dockerfile: dockerfile
    image: geoface-postgres:15-postgis-pgvector
    container_name: geoface-postgres
    environment:
      POSTGRES_DB: geoface_db
      POSTGRES_USER: ${POSTGRES_USER:-geoface}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geoface123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geoface} -d geoface_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: geoface-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Application services ----------
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: dockerfile
    container_name: geoface-ai-service
    ports:
      # host 5001 -> container 5000. Port 5000 di macOS dipakai AirPlay Receiver.
      - "5001:5000"
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
    healthcheck:
      # python selalu ada di image (slim tanpa curl), jadi cek /health pakai urllib
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      minio:
        condition: service_started

  core-service:
    build:
      context: ./services/core-service
      dockerfile: dockerfile
    container_name: geoface-core-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-geoface}:${POSTGRES_PASSWORD:-geoface123}@postgres:5432/geoface_db
      # DEV: true (auto-create tabel). PROD: false + jalankan migration.
      - DB_SYNCHRONIZE=${DB_SYNCHRONIZE:-true}
      - AI_SERVICE_URL=http://ai-service:5000
      # Auth
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-3600s}
      # MinIO (buat face enrollment)
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET=biometric
      # Face matching (cosine distance) — di bawah nilai ini dianggap match.
      - FACE_MATCH_THRESHOLD=${FACE_MATCH_THRESHOLD:-0.40}
      # Liveness/anti-spoofing saat absensi (set "false" untuk mematikan).
      - LIVENESS_ENABLED=${LIVENESS_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      minio:
        condition: service_started

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: dockerfile
    container_name: geoface-api-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - CORE_SERVICE_URL=http://core-service:3001
      - AI_SERVICE_URL=http://ai-service:5000
    depends_on:
      core-service:
        condition: service_started

volumes:
  pgdata:
  miniodata:

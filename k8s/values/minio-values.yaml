image:
  registry: docker.io
  repository: bitnamilegacy/minio
  tag: 2025.7.23-debian-12-r3

console:
  image:
    registry: docker.io
    repository: bitnamilegacy/minio-object-browser
    tag: 2.0.2-debian-12-r3

auth:
  rootUser: "minioadmin"
  rootPassword: "minioadmin123"

# ClusterIP: akses lokal cukup lewat `kubectl port-forward` (bebas tabrakan NodePort).
# Kalau butuh NodePort, ganti type jadi NodePort + pilih port yang BELUM dipakai
# project lain (cek: kubectl get svc -A | grep NodePort). 32000/32001 dipakai project 'portofolio'.
service:
  type: ClusterIP

persistence:
  enabled: true
  size: "10Gi"

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"